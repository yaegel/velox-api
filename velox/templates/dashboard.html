<!DOCTYPE html>
<html>
<head>
    <title>{dashboard_name}</title>
    <style>
        body {{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f6f8; color: #333; margin: 0; padding: 40px; }}
        .container {{ max-width: 1300px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }}
        h1 {{ margin-top: 0; color: #111; font-size: 24px; }}
        .tabs {{ margin-bottom: 20px; border-bottom: 20px; display: flex; gap: 10px; border-bottom: 2px solid #e1e4e8; padding-bottom: 10px; }}
        .tab {{ text-decoration: none; color: #586069; padding: 8px 16px; font-weight: 600; font-size: 14px; border-radius: 6px; transition: all 0.2s; }}
        .tab:hover {{ background: #eaecef; }}
        .tab.active {{ color: #0366d6; background: #dbedff; }}
        table {{ width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; margin-top: 10px; }}
        th {{ background: #fafbfc; border-bottom: 2px solid #e1e4e8; padding: 12px; font-weight: 600; color: #586069; }}
        td {{ border-bottom: 1px solid #e1e4e8; padding: 12px; vertical-align: top; }}
        
        /* Low opacity status-based row colors */
        tr.row-completed {{ background-color: rgba(46, 204, 113, 0.12); }}
        tr.row-failed {{ background-color: rgba(231, 76, 60, 0.12); }}
        tr.row-processing {{ background-color: rgba(52, 152, 219, 0.12); }}
        tr.row-queued {{ background-color: rgba(241, 196, 15, 0.08); }}
        tr:hover {{ background-color: rgba(0, 0, 0, 0.04); }}
        
        .task-name {{ background: #f1f2f6; padding: 3px 6px; border-radius: 4px; font-family: Courier, monospace; font-weight: bold; color: #2f3542; }}
        .badge {{ display: inline-block; padding: 4px 8px; font-size: 11px; font-weight: 700; border-radius: 20px; text-transform: uppercase; }}
        .badge.all {{ background: #dcdde1; color: #2f3542; }}
        .badge.queued {{ background: #ffeaa7; color: #b7791f; }}
        .badge.processing {{ background: #74b9ff; color: #0984e3; }}
        .badge.completed {{ background: #2ecc71; color: white; }}
        .badge.failed {{ background: #e74cbc; color: white; }}
        .priority-num {{ font-weight: bold; color: #2f3542; }}
        .payload-cell {{ font-size: 13px; line-height: 1.4; color: #4b5563; min-width: 320px; }}
        .empty-state {{ text-align: center; color: #8c92ac; padding: 40px; font-style: italic; }}
        
        .action-panel {{ display: flex; gap: 6px; align-items: center; margin-bottom: 5px; }}
        .btn-view {{ background-color: #0366d6; color: white; border: none; padding: 6px 12px; font-size: 12px; font-weight: 600; border-radius: 4px; cursor: pointer; }}
        .btn-view:hover {{ background-color: #024ea1; }}
        .btn-success {{ background-color: #2ecc71; color: white; border: none; padding: 6px 12px; font-size: 12px; font-weight: 600; border-radius: 4px; cursor: pointer; }}
        .btn-success:hover {{ background-color: #27ae60; }}
        .btn-error {{ background-color: #e74c3c; color: white; border: none; padding: 6px 12px; font-size: 12px; font-weight: 600; border-radius: 4px; cursor: pointer; }}
        .btn-error:hover {{ background-color: #c0392b; }}
        .btn-zip {{ background-color: #4b5563; color: white; text-decoration: none; padding: 6px 12px; font-size: 12px; font-weight: 600; border-radius: 4px; display: inline-block; text-align: center; }}
        .btn-zip:hover {{ background-color: #374151; }}
        
        .btn-logs {{ background-color: #8e44ad; color: white; border: none; padding: 6px 12px; font-size: 12px; font-weight: 600; border-radius: 4px; cursor: pointer; }}
        .btn-logs:hover {{ background-color: #732d91; }}
        
        /* ID styling and toggling */
        .id-clickable {{ cursor: pointer; font-family: monospace; color: #0366d6; text-decoration: none; }}
        .id-clickable:hover {{ text-decoration: underline; }}
        .id-clickable .id-full {{ display: none; }}
        .show-full-ids .id-clickable .id-full {{ display: inline; }}
        .show-full-ids .id-clickable .id-short {{ display: none; }}

        /* Modal Overlay Styling */
        .modal-overlay {{
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }}
        
        .modal-overlay.active {{
            display: flex;
        }}

        /* Modal Container */
        .modal-content {{
            background: white;
            border-radius: 12px;
            width: 90%;
            max-width: 950px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            animation: modalSlideIn 0.25s ease-out;
            overflow: hidden;
        }}

        @keyframes modalSlideIn {{
            from {{ transform: translateY(20px); opacity: 0; }}
            to {{ transform: translateY(0); opacity: 1; }}
        }}

        /* Modal Header */
        .modal-header {{
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid #e2e8f0;
            background: #f8fafc;
        }}

        .modal-header h3 {{
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            font-family: monospace;
        }}

        .modal-actions {{
            display: flex;
            align-items: center;
            gap: 12px;
        }}

        /* Copy & Close Buttons inside Modal */
        .btn-copy-modal {{
            background-color: #4b5563;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }}
        .btn-copy-modal:hover {{
            background-color: #374151;
        }}
        
        .btn-close-modal {{
            background: none;
            border: none;
            font-size: 24px;
            line-height: 1;
            color: #64748b;
            cursor: pointer;
            padding: 0 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }}
        .btn-close-modal:hover {{
            color: #0f172a;
        }}

        /* Modal Body */
        .modal-body {{
            padding: 24px;
            overflow-y: auto;
            flex-grow: 1;
            background: #0f172a;
        }}

        #modal-code-render {{
            margin: 0;
            font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
            font-size: 13px;
            line-height: 1.5;
            color: #e2e8f0;
            white-space: pre-wrap;
            word-break: break-all;
        }}

        /* Border variants per content type */
        .modal-content.payload-view {{ border-top: 4px solid #0366d6; }}
        .modal-content.result-view {{ border-top: 4px solid #2ecc71; }}
        .modal-content.error-view {{ border-top: 4px solid #e74c3c; }}
        .modal-content.logs-view {{ border-top: 4px solid #8e44ad; }}

        /* Dropdown Styling */
        .dropdown {{
            position: relative;
            display: inline-block;
            text-align: left;
        }}
        
        .dropdown-trigger {{
            background: none;
            border: none;
            font-size: 20px;
            color: #64748b;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s, color 0.2s;
            line-height: 1;
        }}
        
        .dropdown-trigger:hover {{
            background: #f1f5f9;
            color: #0f172a;
        }}
        
        .dropdown-menu {{
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background: white;
            min-width: 150px;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            z-index: 100;
            overflow: hidden;
            padding: 4px 0;
        }}
        
        .dropdown-menu.active {{
            display: block;
        }}
        
        .dropdown-menu button, .dropdown-menu a {{
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            color: #334155;
            text-decoration: none;
            cursor: pointer;
            box-sizing: border-box;
            font-family: inherit;
        }}
        
        .dropdown-menu button:hover, .dropdown-menu a:hover {{
            background: #f1f5f9;
            color: #0f172a;
        }}

        /* Filter Bar Styling */
        .filter-bar {{
            display: none;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 14px 20px;
            margin-bottom: 20px;
        }}
        
        .filter-bar.active {{
            display: block;
        }}
        
        .filter-group {{
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
        }}
        
        .filter-group label {{
            white-space: nowrap;
        }}

        .filter-group input {{
            padding: 6px 12px;
            font-size: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s;
            background: white;
            font-family: inherit;
        }}
        
        .filter-group input:focus {{
            border-color: #0366d6;
        }}
        
        .btn-search {{
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            color: #0f172a;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }}
        
        .btn-search:hover {{
            background: #e2e8f0;
            border-color: #94a3b8;
        }}

        /* Pagination */
        .pagination-container {{
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            color: #64748b;
            font-weight: 500;
        }}
        
        .pagination-top {{
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
        }}
        
        .pagination-bottom {{
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }}
        
        .pagination-buttons {{
            display: flex;
            gap: 8px;
        }}
        
        .btn-page {{
            text-decoration: none;
            color: #0366d6;
            background: white;
            border: 1px solid #cbd5e1;
            padding: 6px 16px;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.2s;
        }}
        
        .btn-page:hover {{
            background: #f8fafc;
            border-color: #94a3b8;
        }}
        
        .btn-page.disabled {{
            color: #94a3b8;
            background: #f1f5f9;
            border-color: #e2e8f0;
            cursor: not-allowed;
            pointer-events: none;
        }}
    </style>
</head>
<body>
    <div class="container">
        <h1>{dashboard_name}</h1>
        <div class="tabs">
            {status_tabs}
            <div style="margin-left: auto; display: flex; align-items: center; gap: 16px;">
                <button id="toggle-filter-btn" class="btn-search" onclick="toggleFilterBar()" style="padding: 6px 12px; display: flex; align-items: center; gap: 6px;">
                    <span>&#128269;</span> Filters
                </button>
                <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #586069; user-select: none;">
                    <input type="checkbox" id="toggle-all-ids" onclick="toggleAllIds(this)" style="cursor: pointer; width: 16px; height: 16px; margin: 0;">
                    <label for="toggle-all-ids" style="cursor: pointer;">Show Full IDs</label>
                </div>
            </div>
        </div>

        <div class="pagination-container pagination-top">
            {pagination_controls}
        </div>

        <div id="filter-bar-container" class="filter-bar {filter_active_class}">
            <form id="filter-form" method="GET" action="" onsubmit="prepareSubmit(event)" style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin: 0; width: 100%;">
                <input type="hidden" name="status" value="{target_status}">
                
                <!-- Hidden inputs for UTC values sent to server -->
                <input type="hidden" id="min-date-utc" name="min_date" value="{min_date_val}">
                <input type="hidden" id="max-date-utc" name="max_date" value="{max_date_val}">

                <div class="filter-group">
                    <label for="search-input">Search</label>
                    <input type="text" id="search-input" name="search" placeholder="Task name or ID..." value="{search_val}" oninput="triggerAutoSubmit()">
                </div>

                <div class="filter-group">
                    <label for="min-date-local">From</label>
                    <input type="datetime-local" id="min-date-local" onchange="handleDateChange()">
                </div>

                <div class="filter-group">
                    <label for="max-date-local">To</label>
                    <input type="datetime-local" id="max-date-local" onchange="handleDateChange()">
                </div>

                <div class="filter-actions" style="display: flex; gap: 8px; margin-left: auto;">
                    <button type="submit" class="btn-search">Filter</button>
                    {clear_search_btn}
                </div>
            </form>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Task Name</th>
                    <th>Status</th>
                    <th>Priority</th>
                    <th>Created At</th>
                    <th>Started At</th>
                    <th style="text-align: right; padding-right: 20px;">Actions</th>
                </tr>
            </thead>
            <tbody>
                {table_rows}
            </tbody>
        </table>
        <div class="pagination-container pagination-bottom">
            {pagination_controls}
        </div>
    </div>

    <!-- Unified Diagnostic Modal -->
    <div id="diagnostic-modal" class="modal-overlay" onclick="handleModalClickaway(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Task Details</h3>
                <div class="modal-actions">
                    <button class="btn-copy-modal" onclick="copyModalText()">Copy</button>
                    <button class="btn-close-modal" onclick="closeModal()">&times;</button>
                </div>
            </div>
            <div class="modal-body">
                <pre id="modal-code-render"></pre>
            </div>
        </div>
    </div>

    <script>
    let currentModalText = "";

    function showModal(title, text, viewType) {{
        currentModalText = text;
        const modal = document.getElementById('diagnostic-modal');
        const modalContent = modal.querySelector('.modal-content');
        const titleEl = document.getElementById('modal-title');
        const codeEl = document.getElementById('modal-code-render');
        
        // Set content and title
        titleEl.innerText = title;
        codeEl.innerText = text;
        
        // Set color theme border class
        modalContent.className = 'modal-content ' + viewType + '-view';
        
        // Show modal
        modal.classList.add('active');
        
        // Prevent body scrolling
        document.body.style.overflow = 'hidden';
    }}

    function closeModal() {{
        const modal = document.getElementById('diagnostic-modal');
        modal.classList.remove('active');
        document.body.style.overflow = '';
    }}

    function handleModalClickaway(event) {{
        // Close if click target is the overlay itself (not the content dialog)
        if (event.target.id === 'diagnostic-modal') {{
            closeModal();
        }}
    }}

    function copyModalText() {{
        const btn = document.querySelector('.btn-copy-modal');
        navigator.clipboard.writeText(currentModalText).then(() => {{
            btn.innerText = 'Copied!';
            btn.style.backgroundColor = '#2ecc71';
            setTimeout(() => {{
                btn.innerText = 'Copy';
                btn.style.backgroundColor = '#4b5563';
            }}, 1500);
        }}).catch(err => {{
            console.error('Failed to copy: ', err);
        }});
    }}

    function toggleSingleId(element) {{
        const checkbox = document.getElementById('toggle-all-ids');
        checkbox.checked = !checkbox.checked;
        toggleAllIds(checkbox);
    }}

    function toggleAllIds(checkbox) {{
        const container = document.querySelector('.container');
        if (checkbox.checked) {{
            container.classList.add('show-full-ids');
        }} else {{
            container.classList.remove('show-full-ids');
        }}
    }}

    function toggleDetails(taskId, viewType) {{
        if (viewType === 'payload') {{
            fetch('./dashboard/' + taskId + '/args')
                .then(response => response.json())
                .then(data => {{
                    const title = 'Task ' + taskId.substring(taskId.length - 8) + ' - Payload';
                    const text = JSON.stringify(data, null, 2);
                    showModal(title, text, 'payload');
                }})
                .catch(() => {{ alert('Error loading payload'); }});
        }} else if (viewType === 'result') {{
            fetch('./dashboard/' + taskId + '/result')
                .then(response => response.json())
                .then(data => {{
                    const title = 'Task ' + taskId.substring(taskId.length - 8) + ' - Result';
                    const text = JSON.stringify(data, null, 2);
                    showModal(title, text, 'result');
                }})
                .catch(() => {{ alert('Error loading result'); }});
        }} else if (viewType === 'error') {{
            fetch('./dashboard/' + taskId + '/error')
                .then(response => response.json())
                .then(data => {{
                    const title = 'Task ' + taskId.substring(taskId.length - 8) + ' - Error';
                    showModal(title, data.error, 'error');
                }})
                .catch(() => {{ alert('Error loading error details'); }});
        }} else if (viewType === 'logs') {{
            fetch('./dashboard/' + taskId + '/logs')
                .then(response => response.json())
                .then(data => {{
                    const title = 'Task ' + taskId.substring(taskId.length - 8) + ' - Execution Logs';
                    const logsText = data.logs ? data.logs : "No logs recorded.";
                    showModal(title, logsText, 'logs');
                }})
                .catch(() => {{ alert('Error loading logs'); }});
        }}
    }}

    function toggleDropdown(event, taskId) {{
        event.stopPropagation();
        
        // Close all other dropdowns first
        const activeDropdowns = document.querySelectorAll('.dropdown-menu.active');
        activeDropdowns.forEach(menu => {{
            if (menu.id !== 'dropdown-menu-' + taskId) {{
                menu.classList.remove('active');
            }}
        }});
        
        // Toggle the target dropdown
        const targetMenu = document.getElementById('dropdown-menu-' + taskId);
        targetMenu.classList.toggle('active');
    }}

    // Close dropdowns on clicking anywhere on the document
    document.addEventListener('click', function(event) {{
        const activeDropdowns = document.querySelectorAll('.dropdown-menu.active');
        activeDropdowns.forEach(menu => {{
            menu.classList.remove('active');
        }});
    }});

    function toggleFilterBar() {{
        const filterBar = document.getElementById('filter-bar-container');
        filterBar.classList.toggle('active');
    }}

    let debounceTimer;
    function triggerAutoSubmit() {{
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {{
            document.getElementById('filter-form').submit();
        }}, 600);
    }}

    window.addEventListener('DOMContentLoaded', (event) => {{
        // Restore search focus
        const searchInput = document.getElementById('search-input');
        if (searchInput && searchInput.value) {{
            searchInput.focus();
            const len = searchInput.value.length;
            searchInput.setSelectionRange(len, len);
        }}
        
        // Restore local datetimes from UTC values
        const minUtcVal = document.getElementById('min-date-utc').value;
        const maxUtcVal = document.getElementById('max-date-utc').value;
        
        if (minUtcVal) {{
            const minDate = new Date(minUtcVal);
            if (!isNaN(minDate)) {{
                document.getElementById('min-date-local').value = toLocalDateTimeString(minDate);
            }}
        }}
        if (maxUtcVal) {{
            const maxDate = new Date(maxUtcVal);
            if (!isNaN(maxDate)) {{
                document.getElementById('max-date-local').value = toLocalDateTimeString(maxDate);
            }}
        }}

        // Convert table timestamps to local time
        document.querySelectorAll('.local-time').forEach(el => {{
            const utcStr = el.getAttribute('data-utc');
            if (utcStr && utcStr !== '-') {{
                let dateStr = utcStr;
                if (!dateStr.endsWith('Z') && !dateStr.includes('+')) {{
                    dateStr += 'Z';
                }}
                const localDate = new Date(dateStr);
                if (!isNaN(localDate)) {{
                    el.innerText = formatLocalDateTime(localDate);
                }}
            }}
        }});
    }});

    function toLocalDateTimeString(date) {{
        const tzoffset = date.getTimezoneOffset() * 60000;
        return (new Date(date - tzoffset)).toISOString().slice(0, 16);
    }}

    function formatLocalDateTime(date) {{
        const pad = (n) => n.toString().padStart(2, '0');
        const yyyy = date.getFullYear();
        const mm = pad(date.getMonth() + 1);
        const dd = pad(date.getDate());
        const hh = pad(date.getHours());
        const min = pad(date.getMinutes());
        const ss = pad(date.getSeconds());
        return `${{yyyy}}-${{mm}}-${{dd}} ${{hh}}:${{min}}:${{ss}}`;
    }}

    function handleDateChange() {{
        const minLocal = document.getElementById('min-date-local').value;
        const maxLocal = document.getElementById('max-date-local').value;
        
        const minUtcInput = document.getElementById('min-date-utc');
        const maxUtcInput = document.getElementById('max-date-utc');
        
        if (minLocal) {{
            minUtcInput.value = new Date(minLocal).toISOString();
        }} else {{
            minUtcInput.value = "";
        }}
        
        if (maxLocal) {{
            maxUtcInput.value = new Date(maxLocal).toISOString();
        }} else {{
            maxUtcInput.value = "";
        }}
        
        document.getElementById('filter-form').submit();
    }}

    function prepareSubmit(event) {{
        const minLocal = document.getElementById('min-date-local').value;
        const maxLocal = document.getElementById('max-date-local').value;
        
        const minUtcInput = document.getElementById('min-date-utc');
        const maxUtcInput = document.getElementById('max-date-utc');
        
        if (minLocal) {{
            minUtcInput.value = new Date(minLocal).toISOString();
        }} else {{
            minUtcInput.value = "";
        }}
        
        if (maxLocal) {{
            maxUtcInput.value = new Date(maxLocal).toISOString();
        }} else {{
            maxUtcInput.value = "";
        }}
    }}
    </script>
</body>
</html>
